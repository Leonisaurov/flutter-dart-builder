# ============================================================
# CHECKOUT.CONF — define la fuente del código a construir.
# ============================================================
# Dos modos:
#
#   1) Repositorio remoto (público): URL https/git. Se clona el
#      último commit de su rama por defecto (o la de BRANCH).
#      Ejemplo:  REPO_URL=https://github.com/usuario/proyecto.git
#
#   2) Fuente local: directorio DENTRO de este mismo repositorio
#      (debe estar commiteado). Se usa el código del último commit.
#      Ejemplo:  REPO_URL=./mi_app
#
# Solo se usa un modo a la vez.

REPO_URL=./stalker

# Opcional (solo modo remoto): rama concreta. Vacío = rama por defecto.
# BRANCH=main
