# ============================================================
# RELEASES.CONF — define qué GitHub Releases se crean por build.
# ============================================================
# Formato: nombre_del_release=patrón_glob
#   - El patrón es relativo a la raíz de este repositorio-runner.
#   - Debe coincidir con los artefactos que copiaste en build.sh
#     (por defecto: $GITHUB_WORKSPACE/artifacts/ -> "artifacts/...").
#   - Si no hay ningún archivo que coincida, el release se omite.
#   - El tag se genera automáticamente: <nombre>-<fecha-hora UTC>.
#
# Descomenta/define los que quieras. Ejemplos:
# release-apk=artifacts/*.apk
# release-aab=artifacts/*.aab
# release-exe=artifacts/myapp
